name: CI - Build & Test

# Kích hoạt khi push lên main/develop hoặc mở PR
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code về runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài JDK (chọn version khớp với project của bạn)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven          # cache dependencies cho nhanh

      # 3. Check cú pháp (biên dịch)
      - name: Compile (syntax check)
        run: mvn -B compile

      # 4. Chạy test
      - name: Run tests
        run: mvn -B test

      # 5. Đóng gói jar (bỏ qua test vì đã chạy ở bước trên)
      - name: Package
        run: mvn -B package -DskipTests

      # 6. (Tuỳ chọn) Lưu file jar làm artifact để tải về
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar